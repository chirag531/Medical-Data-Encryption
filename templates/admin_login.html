{% extends "base.html" %}

{% block title %}Admin Login - MedSecure{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card fade-in-up">
            <div class="card-header bg-primary text-white text-center py-4">
                <h4 class="mb-0"><i class="fas fa-user-shield me-2"></i>Admin Login</h4>
                <p class="mb-0 mt-2">Secure Medical Data Management</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin_login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope me-2"></i>Email Address
                        </label>
                        <input type="email" class="form-control" id="email" name="email" 
                               placeholder="admin@medsecure.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock me-2"></i>Password
                        </label>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="Enter your password" required>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="fas fa-sign-in-alt me-2"></i>Login to Dashboard
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="mb-2">Don't have an admin account?</p>
                    <a href="{{ url_for('admin_register') }}" class="btn btn-outline-primary">
                        <i class="fas fa-user-plus me-2"></i>Register as Admin
                    </a>
                </div>
                
                <div class="text-center mt-3">
                    <a href="{{ url_for('index') }}" class="text-muted">
                        <i class="fas fa-arrow-left me-1"></i>Back to Home
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Security Features Info -->
        <div class="card mt-4">
            <div class="card-body text-center">
                <h6><i class="fas fa-shield-alt me-2 text-primary"></i>Security Features</h6>
                <div class="row mt-3">
                    <div class="col-6">
                        <small><i class="fas fa-check text-success me-1"></i>Encrypted Sessions</small>
                    </div>
                    <div class="col-6">
                        <small><i class="fas fa-check text-success me-1"></i>Audit Logging</small>
                    </div>
                    <div class="col-6">
                        <small><i class="fas fa-check text-success me-1"></i>2FA Ready</small>
                    </div>
                    <div class="col-6">
                        <small><i class="fas fa-check text-success me-1"></i>Auto Logout</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
